# General  
train_2d: False
no_eval: True
eval_last: False
finetune: True
partial_train: null

# Traning 
epochs: 10
checkpoint_frequency: 1
batch_size: 16
dropout: 0.0
learning_rate: 0.00025
weight_decay: 0.02
lr_decay: 0.98
pretrain_3d_curriculum: 30

# Model
maxlen: 243
dim_feat: 256
mlp_ratio: 4
depth: 5
dim_rep: 512
num_heads: 8
att_fuse: True

# Data
data_root: ../DL_Project/pose_3d_v3/
subset_list: [frame_81]
dt_file: h36m_sh_conf_cam_source_final.pkl
clip_len: 243
data_stride: 81
rootrel: False
sample_stride: 1
num_joints: 17
no_conf: False
gt_2d: True

# Loss
lambda_3d_velocity: 20.0
lambda_scale: 0.5
lambda_lv: 0.0
lambda_lg: 0.0
lambda_a: 0.0
lambda_av: 0.0

# Augmentation
synthetic: False   # synthetic: don't use 2D detection results, fake it (from 3D)
flip: False
mask_ratio: 0.0
mask_T_ratio: 0
noise: False
noise_path: params/synthetic_noise.pth
d2c_params_path: params/d2c_params.pkl